version: '3'

services:
  sut:
    image: sut:latest
    build:
      context: .
      dockerfile: Dockerfile.s6-overlay
    working_dir: /usr/src/app
    environment:
      DNS_TLD: example.test
      UI_HOST: preset.example.test
    volumes:
      - ./tests:/usr/src/app/tests:ro
    command:
      - /bin/bash
      - -c
      - |
        set -e
        echo "=== Installing BATS test framework ==="
        npm install -g bats bats-support bats-assert
        echo ""

        echo "=== Running load_env_file tests ==="
        bats /usr/src/app/tests/load_env_file.bats

        echo ""
        echo "=== Running systemd comparison tests ==="
        bats /usr/src/app/tests/systemd_comparison.bats

        echo ""
        echo "=== Running s6 env tests ==="
        bats /usr/src/app/tests/s6_env.bats

        echo ""
        echo "=== Running vulnerable package tests ==="
        bats /usr/src/app/tests/vulnerable_packages.bats
